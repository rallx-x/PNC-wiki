<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>뉴럴 클라우드 인형 위키 HTML 생성기</title>
    <link rel="stylesheet" href="./style.css" />
</head>

<body>
    <div class="app">
        <header class="app-header">
            <div>
                <h1>뉴럴 클라우드 인형 위키 HTML 생성기</h1>
                <p>정보를 입력하면 티스토리용 위키 HTML을 생성합니다.</p>
            </div>

            <div class="header-actions">
                <button type="button" class="header-button" id="saveJsonButton">
                    JSON 저장
                </button>

                <label class="header-button file-button" for="loadJsonInput">
                    JSON 불러오기
                </label>
                <input id="loadJsonInput" type="file" accept=".json" hidden />

                <button type="button" class="header-button danger" id="resetButton">
                    초기화
                </button>
            </div>
        </header>

        <main class="workspace">
            <section class="editor-panel" id="editorPanel">
                <div class="panel-header">
                    <h2>입력</h2>
                    <span>Phase 1</span>
                </div>

                <div class="form-section-title">프로필</div>

                <div class="form-group">
                    <label for="dollName">이름</label>
                    <input id="dollName" type="text" data-field="profile.name" />
                </div>

                <div class="form-group">
                    <label for="dollNameCn">중국어명</label>
                    <input id="dollNameCn" type="text" data-field="profile.names.cn" />

                    <label for="dollNameJp" class="sub-label">일본어명</label>
                    <input id="dollNameJp" type="text" data-field="profile.names.jp" />

                    <label for="dollNameEn" class="sub-label">영어명</label>
                    <input id="dollNameEn" type="text" data-field="profile.names.en" />
                </div>

                <div class="form-group">
                    <label for="dollJob">직업</label>
                    <input id="dollJob" type="text" data-field="profile.job" />
                </div>

                <div class="form-group">
                    <label for="dollModel">모델</label>
                    <input id="dollModel" type="text" data-field="profile.model" />
                </div>

                <div class="form-group">
                    <label>기업</label>
                    <div class="checkbox-grid radio-grid">
                        <label>
                            <input type="radio" name="profile.company" data-field="profile.company" value="" />
                            선택 안 함
                        </label>

                        <label>
                            <input type="radio" name="profile.company" data-field="profile.company" value="42lab" />
                            42LAB
                        </label>

                        <label>
                            <input type="radio" name="profile.company" data-field="profile.company" value="svarog" />
                            스바로그
                        </label>

                        <label>
                            <input type="radio" name="profile.company" data-field="profile.company" value="ultimatelife" />
                            얼티라이프
                        </label>

                        <label>
                            <input type="radio" name="profile.company" data-field="profile.company" value="uas" />
                            UAS
                        </label>

                        <label>
                            <input type="radio" name="profile.company" data-field="profile.company" value="cybermedia" />
                            사이버미디어
                        </label>

                        <label>
                            <input type="radio" name="profile.company" data-field="profile.company" value="sanctifier" />
                            정화자
                        </label>

                        <label>
                            <input type="radio" name="profile.company" data-field="profile.company" value="entropics" />
                            엔트로피
                        </label>

                        <label>
                            <input type="radio" name="profile.company" data-field="profile.company" value="alternatives" />
                            특수
                        </label>
                    </div>
                </div>

                <div class="form-group">
                    <label>클래스</label>
                    <div class="checkbox-grid radio-grid">
                        <label>
                            <input type="radio" name="profile.class" data-field="profile.class" value="" />
                            선택 안 함
                        </label>

                        <label>
                            <input type="radio" name="profile.class" data-field="profile.class" value="guard" />
                            수위
                        </label>

                        <label>
                            <input type="radio" name="profile.class" data-field="profile.class" value="warrior" />
                            전사
                        </label>

                        <label>
                            <input type="radio" name="profile.class" data-field="profile.class" value="specialist" />
                            해결사
                        </label>

                        <label>
                            <input type="radio" name="profile.class" data-field="profile.class" value="medic" />
                            치료사
                        </label>

                        <label>
                            <input type="radio" name="profile.class" data-field="profile.class" value="sniper" />
                            사수
                        </label>
                    </div>
                </div>

                <div class="form-group">
                    <label>포지션 (최대 2개)</label>
                    <!-- 체크박스는 GAME_DATA.position으로 자동 생성. 여러 개 선택, 고른 순서대로 표시 -->
                    <div class="gift-summary" id="positionSummary"></div>
                    <div class="checkbox-grid radio-grid" id="positionPicker"></div>
                </div>

                <div class="form-group">
                    <label>레어도</label>
                    <div class="checkbox-grid radio-grid rarity-grid">
                        <label>
                            <input type="radio" name="profile.rarity" data-field="profile.rarity" value="" />
                            선택 안 함
                        </label>

                        <label>
                            <input type="radio" name="profile.rarity" data-field="profile.rarity" value="1" />
                            ★1
                        </label>

                        <label>
                            <input type="radio" name="profile.rarity" data-field="profile.rarity" value="2" />
                            ★2
                        </label>

                        <label>
                            <input type="radio" name="profile.rarity" data-field="profile.rarity" value="3" />
                            ★3
                        </label>
                    </div>
                </div>

                <div class="form-group">
                    <label>생일</label>

                    <div class="birthday-select-row">
                        <select id="dollBirthdayMonth" data-field="profile.birthday.month">
                            <option value="">- 월</option>
                            <option value="1">1월</option>
                            <option value="2">2월</option>
                            <option value="3">3월</option>
                            <option value="4">4월</option>
                            <option value="5">5월</option>
                            <option value="6">6월</option>
                            <option value="7">7월</option>
                            <option value="8">8월</option>
                            <option value="9">9월</option>
                            <option value="10">10월</option>
                            <option value="11">11월</option>
                            <option value="12">12월</option>
                        </select>

                        <!-- 일 목록은 월에 맞춰 script.js가 자동으로 채움 -->
                        <select id="dollBirthdayDay" data-field="profile.birthday.day">
                            <option value="">- 일</option>
                        </select>
                    </div>

                    <label class="birthday-unknown">
                        <input type="checkbox" id="dollBirthdayUnknown" data-field="profile.birthday.unknown" />
                        불명
                    </label>
                </div>

                <div class="form-group">
                    <label for="dollVoiceName">성우</label>
                    <input id="dollVoiceName" type="text" data-field="profile.voiceActor.name" />

                    <label class="sub-label">성우 국가</label>
                    <!-- 선택지는 GAME_DATA.country로 자동 생성 -->
                    <div class="checkbox-grid radio-grid" data-options="country" data-options-field="profile.voiceActor.country"></div>
                </div>

                <div class="form-group">
                    <label for="dollIllustrator">일러스트</label>
                    <input id="dollIllustrator" type="text" data-field="profile.illustrator" />
                </div>

                <div class="form-group">
                    <label for="dollHistory">이력</label>
                    <textarea id="dollHistory" rows="4" data-field="profile.history"></textarea>
                </div>

                <div class="form-section-title">개요</div>

                <div class="form-group">
                    <label for="dollQuote">인용문</label>
                    <textarea id="dollQuote" rows="4" data-field="overview.quote"></textarea>
                </div>

                <div class="form-section-title">추천 알고리즘</div>

                <div class="form-group">
                    <!-- 구역·선택지는 script.js가 GAME_DATA로 자동 생성 -->
                    <div id="algorithmPicker"></div>
                </div>

                <div class="form-section-title">친밀도</div>

                <div class="form-group">
                    <label>친밀도 스킬</label>
                    <!-- 칸과 선택지는 script.js가 GAME_DATA.intimacy로 자동 생성 -->
                    <div id="intimacySkillSlots"></div>
                </div>

                <div class="form-group">
                    <label>선물 반응</label>
                    <!-- 선물 목록은 script.js가 GAME_DATA.gift로 자동 생성 -->
                    <div class="gift-summary" id="giftSummary"></div>
                    <div id="giftPicker"></div>
                </div>

                <div class="form-section-title">문단 설정</div>

                <div class="form-group">
                    <div class="checkbox-grid section-toggle-grid">
                        <label>
                            <input type="checkbox" data-section="overview" checked disabled />
                            개요
                        </label>

                        <label>
                            <input type="checkbox" data-section="profile" checked disabled />
                            프로필
                        </label>

                        <label>
                            <input type="checkbox" data-section="performance" checked disabled />
                            성능
                        </label>

                        <label>
                            <input type="checkbox" data-field="sections.weapon" />
                            무장각인
                        </label>

                        <label>
                            <input type="checkbox" data-section="algorithm" checked disabled />
                            추천 알고리즘
                        </label>

                        <label>
                            <input type="checkbox" data-section="intimacy" checked disabled />
                            친밀도
                        </label>

                        <label>
                            <input type="checkbox" data-field="sections.story" />
                            스토리
                        </label>

                        <label>
                            <input type="checkbox" data-field="sections.appearance" />
                            작중 행적
                        </label>

                        <label>
                            <input type="checkbox" data-section="skin" checked disabled />
                            스킨
                        </label>

                        <label>
                            <input type="checkbox" data-section="relationship" checked disabled />
                            인형 관계
                        </label>

                        <label>
                            <input type="checkbox" data-section="voice" checked disabled />
                            대사
                        </label>

                        <label>
                            <input type="checkbox" data-section="etc" checked disabled />
                            기타
                        </label>
                    </div>
                </div>
            </section>

            <section class="preview-panel">
                <div class="panel-header">
                    <h2>미리보기</h2>
                    <span>Preview</span>
                </div>

                <!-- 문서 내용은 renderer.js가 채움 -->
                <article class="wiki-preview" id="preview"></article>
            </section>
        </main>
    </div>

    <script src="./data/game-data.js"></script>
    <script src="./renderer.js"></script>
    <script src="./script.js"></script>
</body>

</html>
